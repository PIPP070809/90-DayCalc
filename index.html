*{margin:0;padding:0;box-sizing:border-box;font-family:'Playfair Display',serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:#f5f7fb}
.card{background:#fff;border-radius:22px;padding:40px;width:520px;max-width:100%;text-align:center;box-shadow:0 15px 45px rgba(0,0,0,.12)}
h2{font-size:36px;color:#333;margin-bottom:8px}

.main-option:hover{background:linear-gradient(135deg,#25c8e8,#249cf5);color:white;transform:translateY(-2px)}
.hidden{display:none!important}
.desc{margin:18px 0;color:#777;font-size:14px;line-height:1.7}
.options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opt-btn{padding:10px 12px;border-radius:10px;background:#f3f5fa;border:1px solid #e5e8ef;color:#555;cursor:pointer;font-size:12px}
.opt-btn.active{background:linear-gradient(135deg,#25c8e8,#249cf5);color:white;border:none}
input{width:100%;padding:14px;margin:16px 0;border:1px solid #dfe5ef;border-radius:12px;background:#fafcff;color:#333;font-size:14px}
input[type=file]{cursor:pointer}
button{width:100%;padding:14px;margin-top:8px;border:none;border-radius:13px;cursor:pointer;background:linear-gradient(135deg,#27d3e9,#2498f5);color:white;font-weight:600;font-size:14px;box-shadow:0 5px 15px rgba(36,156,245,.2);transition:.25s}
button:hover{transform:translateY(-1px)}
button:disabled{opacity:.55;cursor:wait;transform:none}
.secondary-btn{background:#edf1f7;color:#555;box-shadow:none}
#result,#sklResult,#jpgPdfResult,#pdfJpgResult{margin-top:15px;color:#555;font-size:13px;line-height:1.7;overflow-wrap:anywhere}
.highlight{color:#ff4d4d;font-weight:600}
.converter-panel{text-align:left;margin-top:18px}
.converter-panel .desc{text-align:center}
.upload-area{display:block;border:2px dashed #cbd9eb;border-radius:16px;padding:24px 14px;background:#f8fbff;text-align:center;cursor:pointer}
.upload-area:hover{border-color:#2498f5;background:#f0f8ff}
.upload-icon{font-size:32px;margin-bottom:8px}
.upload-title{font-size:14px;color:#444;font-weight:600}
.upload-subtitle{font-size:12px;color:#999;margin-top:6px}
.upload-area input[type=file]{margin-bottom:0;background:transparent;border:none;padding:12px 0 0;font-size:12px}
.file-info{margin-top:12px;padding:12px;border-radius:10px;background:#f1f6fc;color:#526176;font-size:12px;line-height:1.7;overflow-wrap:anywhere}
.merge-help{font-size:12px;color:#718096;line-height:1.6;margin:10px 0;text-align:center}
.merge-pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px;text-align:left}
